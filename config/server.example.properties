# Copy to server.properties and edit. server.properties is git-ignored.
# Secrets are NOT stored here: set HRM_DB_PASSWORD and HRM_KEYSTORE_PASSWORD as environment variables.
rmi.port=1099
# Fixed port for the service itself, so a firewall needs only two known ports (1099 and this one).
rmi.objectPort=1100
# The address the server puts into the stubs it hands out, so every client connects to it. It must be one of
# the addresses in the server certificate. localhost means only programs on this computer can connect. For
# other computers, use this computer's IP address (or name) and make the keys with that address:
# setup.bat -ServerAddress <address> does both. See docs/two-computer-setup.md.
rmi.hostname=localhost
# sslMode=REQUIRED encrypts the DB connection but does not verify the server certificate.
# That is acceptable for a throwaway local database only. For any other database use
# sslMode=VERIFY_IDENTITY and set trustCertificateKeyStoreUrl / trustCertificateKeyStorePassword.
db.url=jdbc:mysql://localhost:3306/hrm?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.3,TLSv1.2&allowPublicKeyRetrieval=false&allowLoadLocalInfile=false&connectTimeout=5000
db.user=hrm_app
tls.keystore=config/server.keystore
