# Copy to client.properties and edit. client.properties is git-ignored.
# Set HRM_TRUSTSTORE_PASSWORD as an environment variable.
# The server's address: localhost on the server computer itself, otherwise the server's IP address or name
# (the rmi.hostname shown when the server starts). It must be one of the addresses in the server certificate.
server.host=localhost
rmi.port=1099
tls.truststore=config/client.truststore
