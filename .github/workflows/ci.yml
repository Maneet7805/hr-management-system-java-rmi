name: CI

# Builds the project and runs every test on each pull request and on each push to main.
on:
  pull_request:
  push:
    branches: [main]

# The job only needs to read the code. No write access means a bug here cannot change the repo.
permissions:
  contents: read

# A newer push to the same branch makes the older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway MySQL that exists only for this run, so the database tests really execute.
    # These passwords protect nothing: the container is destroyed when the job ends.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-throwaway
          MYSQL_DATABASE: hrm_test
          MYSQL_USER: hrm_app
          MYSQL_PASSWORD: ci-app-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-throwaway"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      HRM_DB_PASSWORD: ci-app-throwaway

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
