name: CI

# Builds the project on each pull request and on each push to main.
on:
  pull_request:
  push:
    branches: [main]

# The job only needs to read the code. No write access means a bug here cannot change the repo.
permissions:
  contents: read

# A newer push to the same branch makes the older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress verify

